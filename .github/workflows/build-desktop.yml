
name: Build MAI Studio Desktop

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to build"
        type: choice
        options:
          - qa
          - prod
          - both
        default: both

  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

        env:
          - qa
          - prod

    runs-on: ${{ matrix.os }}

    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        inputs.env == 'both' ||
        inputs.env == matrix.env
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:${{ matrix.env }}:${{ matrix.platform }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mai-studio-${{ matrix.env }}-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error